# Central MEC/RASOUL-style variable ranges used by the simulator.
# The public pages for RASOUL expose the paper metadata, DOI, and abstract but not
# the full numerical experiment table. Keep this file as the single source of truth
# for the project variables; if you obtain the IEEE PDF table, update only this file
# and regenerate scenario configs with the same field names.
seed: 42
simulation:
  slot_duration_s: 1.0
area:
  width_m: 1000.0
  height_m: 1000.0
devices:
  cpu_capacity_mips: [400.0, 1200.0]
  battery_j: [8000.0, 16000.0]
  tx_power_w: [0.3, 1.0]
  local_power_w: [0.6, 2.0]
  mobility_speed_mps: [0.0, 1.5]
  failure_probability: [0.001, 0.01]
servers:
  cpu_capacity_mips: [8000.0, 30000.0]
  bandwidth_mhz: [10.0, 50.0]
  failure_probability: [0.001, 0.03]
  static_power_w: [60.0, 150.0]
  dynamic_power_w: [30.0, 100.0]
tasks:
  tasks_per_device: 200
  data_size_mb: [0.2, 8.0]
  output_size_mb: [0.02, 1.0]
  cpu_cycles_mi: [300.0, 6000.0]
  deadline_s: [0.5, 8.0]
  priority: [1, 5]
channel:
  noise_power_w: 1.0e-12
  path_loss_exponent: 3.0
  reference_gain: 1.0e-3
  min_rate_mbps: 0.1
  packet_loss_base: 0.005
