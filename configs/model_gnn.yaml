model: gnn
seed: 11
architecture: graph_attention
lookback_window: 16
prediction_horizon: 1
node_input_features: 7
target_columns: [0, 1]
hidden_size: 128
num_layers: 2
dropout: 0.15
batch_size: 64
optimizer: AdamW
learning_rate: 0.0003
weight_decay: 0.0001
loss: mse
grad_clip: 1.0
validation_fraction: 0.20
validation_split: chronological
separation_gap_windows: 16
trace_candidate_count: 8
epochs: 200
early_stopping_patience: 20
top_k: 16
k_neighbors: 8
